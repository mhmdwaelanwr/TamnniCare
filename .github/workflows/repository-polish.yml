name: Repository Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean public repository and normalize file modes
        shell: bash
        run: |
          set -euo pipefail

          # Keep third-party/reference design material out of the public source tree.
          git rm -r --ignore-unmatch anwar/Gemini_Design_Pack

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.gitignore')
          text = p.read_text() if p.exists() else ''
          entries = [
              'anwar/Gemini_Design_Pack/',
              'reference/ui_inspiration/',
              'reference/app_examples/',
              '.env',
              '.env.*',
              '*.keystore',
              '*.jks',
              '*.p12',
              '*.pfx',
              'google-services.json',
              'GoogleService-Info.plist',
              'Secrets.xcconfig',
          ]
          lines = text.splitlines()
          for entry in entries:
              if entry not in lines:
                  lines.append(entry)
          p.write_text('\n'.join(lines).rstrip() + '\n')
          PY
          git add .gitignore

          # NTFS-mounted source marked almost every file executable. Keep only real shell launchers executable.
          while IFS= read -r -d '' entry; do
            mode="${entry%% *}"
            [ "$mode" = "100755" ] || continue
            path="${entry#*$'\t'}"
            case "$path" in
              gradlew|*.sh)
                ;;
              *)
                git update-index --chmod=-x -- "$path"
                ;;
            esac
          done < <(git ls-files -s -z)

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Polish public repository contents and file modes"
            git push origin HEAD:main
          else
            echo "No cleanup changes needed."
          fi
